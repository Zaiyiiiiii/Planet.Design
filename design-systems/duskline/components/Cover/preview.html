<style>

<!--
  blocks      brass 128×256 slab bled off the top (the brand, largest) · brass-soft 96×160 tint · survey 200×216 bleeding off the right edge · neon 64×24 once (the action colour, kept small) · moss 48×24 once · six signal-cyan rain strokes across the survey block — about 35% of 960×288

  pattern     literal motif, from "the ring is every satellite": four orbits (space-8 + space-6 steps) around a void disc cut from the slab, five satellites (space-3 discs, radius-ring) riding them
  scales      sides in space-4 multiples; gutters space-2; orbit radii 56/88/120/152; disc radius-ring
-->
